[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mediathek-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for the German public broadcasters' Mediathek — search ARD, ZDF, 3sat, ARTE, Phoenix and more via MediathekViewWeb"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
mediathek-mcp = "mediathek_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mediathek_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real MediathekViewWeb API"]

